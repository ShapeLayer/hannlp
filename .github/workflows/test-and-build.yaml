name: Test and Build

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: Check ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure user data directory
        shell: bash
        run: printf 'HANNLP_USER_DATA_DIR=%s/hannlp-user-data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system check tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts \
            tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::sessioninfo
          needs: check

      - name: Check source tree cleanliness
        shell: bash
        run: |
          if compgen -G "src/*.o" > /dev/null || compgen -G "src/*.so" > /dev/null || compgen -G "src/*.dll" > /dev/null || compgen -G "src/*.dylib" > /dev/null; then
            printf 'Compiled artifacts must not be committed under src/.\n'
            ls -la src
            exit 1
          fi

      - name: R CMD check and collect results
        shell: Rscript {0}
        env:
          MATRIX_OS: ${{ matrix.config.os }}
          MATRIX_R: ${{ matrix.config.r }}
        run: |
          dir.create("check-summary", showWarnings = FALSE)

          result <- rcmdcheck::rcmdcheck(
            ".",
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual", "--no-resave-data"),
            error_on = "never",
            check_dir = "check"
          )

          count_items <- function(x) {
            if (is.null(x)) return(0L)
            if (is.data.frame(x)) return(nrow(x))
            length(x)
          }

          errors <- count_items(result$errors)
          warnings <- count_items(result$warnings)
          notes <- count_items(result$notes)
          status <- sprintf("%d errors, %d warnings, %d notes", errors, warnings, notes)
          package_name <- read.dcf("DESCRIPTION", fields = "Package")[[1L]]
          check_log <- file.path("check", sprintf("%s.Rcheck", package_name), "00check.log")

          command_output <- function(command, args = character()) {
            output <- tryCatch(
              system2(command, args, stdout = TRUE, stderr = TRUE),
              error = function(e) character()
            )
            output[nzchar(output)]
          }

          clean_field <- function(x) {
            gsub("[\t\r\n]+", " ", x)
          }

          os_release <- switch(
            Sys.getenv("RUNNER_OS"),
            Linux = {
              if (file.exists("/etc/os-release")) {
                lines <- readLines("/etc/os-release", warn = FALSE)
                fields <- strsplit(lines[grepl("=", lines, fixed = TRUE)], "=", fixed = TRUE)
                values <- vapply(fields, function(x) gsub('^"|"$', "", x[2L]), character(1L))
                names(values) <- vapply(fields, `[[`, character(1L), 1L)
                value <- values[intersect(c("PRETTY_NAME", "VERSION_ID", "VERSION_CODENAME"), names(values))]
                paste(value[nzchar(value)], collapse = "; ")
              } else {
                paste(command_output("uname", c("-srvmo")), collapse = " ")
              }
            },
            macOS = paste(command_output("sw_vers"), collapse = "; "),
            Windows = paste(command_output("cmd", c("/c", "ver")), collapse = "; "),
            paste(Sys.info()[c("sysname", "release", "version")], collapse = "; ")
          )

          os_detail <- paste(
            c(
              sprintf("Runner OS: %s", Sys.getenv("RUNNER_OS", unset = "unknown")),
              if (nzchar(Sys.getenv("ImageOS"))) sprintf("ImageOS: %s", Sys.getenv("ImageOS")) else character(),
              if (nzchar(Sys.getenv("ImageVersion"))) sprintf("ImageVersion: %s", Sys.getenv("ImageVersion")) else character(),
              if (nzchar(os_release)) sprintf("OS release: %s", os_release) else character()
            ),
            collapse = "; "
          )
          os_detail <- clean_field(os_detail)

          note_text <- if (notes > 0L) {
            paste(capture.output(print(result$notes)), collapse = "\n")
          } else {
            "None"
          }

          warning_text <- if (warnings > 0L) {
            paste(capture.output(print(result$warnings)), collapse = "\n")
          } else {
            "None"
          }

          error_text <- if (errors > 0L) {
            paste(capture.output(print(result$errors)), collapse = "\n")
          } else {
            "None"
          }

          fragment <- c(
            sprintf("- %s, R %s: %s", Sys.getenv("MATRIX_OS"), Sys.getenv("MATRIX_R"), status),
            sprintf("  - R: %s", R.version.string),
            sprintf("  - Platform: %s", R.version$platform),
            sprintf("  - Check log: %s", check_log),
            ""
          )

          result_row <- data.frame(
            os = Sys.getenv("MATRIX_OS"),
            r = Sys.getenv("MATRIX_R"),
            r_version = R.version.string,
            platform = R.version$platform,
            os_detail = os_detail,
            errors = errors,
            warnings = warnings,
            notes = notes,
            check_log = check_log,
            stringsAsFactors = FALSE
          )

          utils::write.table(
            result_row,
            file.path(
              "check-summary",
              sprintf("cran-comments-result-%s-%s.tsv", Sys.getenv("MATRIX_OS"), Sys.getenv("MATRIX_R"))
            ),
            sep = "\t",
            quote = FALSE,
            row.names = FALSE
          )

          writeLines(fragment, file.path(
            "check-summary",
            sprintf("cran-comments-%s-%s.md", Sys.getenv("MATRIX_OS"), Sys.getenv("MATRIX_R"))
          ))

          summary <- c(
            sprintf("## CRAN Comments Test Result: %s / R %s", Sys.getenv("MATRIX_OS"), Sys.getenv("MATRIX_R")),
            "",
            sprintf("- R CMD check result: %s", status),
            sprintf("- R version: %s", R.version.string),
            sprintf("- Platform: %s", R.version$platform),
            "",
            "### Notes",
            "```text",
            note_text,
            "```",
            "",
            "### Warnings",
            "```text",
            warning_text,
            "```",
            "",
            "### Errors",
            "```text",
            error_text,
            "```",
            ""
          )

          writeLines(summary, file.path(
            "check-summary",
            sprintf("check-summary-%s-%s.md", Sys.getenv("MATRIX_OS"), Sys.getenv("MATRIX_R"))
          ))

          github_summary <- Sys.getenv("GITHUB_STEP_SUMMARY", unset = "")
          if (nzchar(github_summary)) {
            cat(paste(summary, collapse = "\n"), file = github_summary, append = TRUE)
          }

          if (errors > 0L || warnings > 0L) {
            quit(status = 1L)
          }

      - name: Upload check logs
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: check-results-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check

      - name: Upload CRAN comments fragment
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: cran-comments-input-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: check-summary

  cran-submission:
    name: Build CRAN Submission Artifact
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Download CRAN comments inputs
        uses: actions/download-artifact@v5
        with:
          pattern: cran-comments-input-*
          path: cran-comments-input
          merge-multiple: true

      - name: Render CRAN comments
        shell: Rscript {0}
        run: |
          result_files <- list.files(
            "cran-comments-input",
            pattern = "^cran-comments-result-.*[.]tsv$",
            recursive = TRUE,
            full.names = TRUE
          )
          if (length(result_files) == 0L) {
            stop("No CRAN comments result files were downloaded.", call. = FALSE)
          }

          results <- do.call(rbind, lapply(result_files, utils::read.delim, stringsAsFactors = FALSE))
          results <- results[order(results$os, results$r), , drop = FALSE]

          test_results <- unlist(Map(
            function(os, r, r_version, platform, os_detail, errors, warnings, notes) {
              c(
                sprintf("- %s, R %s (%s; %s)", os, r, r_version, platform),
                sprintf("  - %s errors, %s warnings, %s notes", errors, warnings, notes),
                sprintf("  - Environment: %s", os_detail)
              )
            },
            results$os,
            results$r,
            results$r_version,
            results$platform,
            results$os_detail,
            results$errors,
            results$warnings,
            results$notes
          ), use.names = FALSE)

          run_url <- sprintf(
            "%s/%s/actions/runs/%s",
            Sys.getenv("GITHUB_SERVER_URL", unset = "https://github.com"),
            Sys.getenv("GITHUB_REPOSITORY"),
            Sys.getenv("GITHUB_RUN_ID")
          )

          test_results <- c(
            test_results,
            "",
            "There were no ERRORs or WARNINGs in the GitHub Actions matrix.",
            "Any remaining NOTE is expected for a new CRAN submission:",
            "",
            "```text",
            "New submission",
            "```",
            "",
            sprintf("For detailed execution information, visit the [GitHub Actions run](%s).", run_url)
          )

          replace_block <- function(lines, start_marker, end_marker, replacement) {
            start <- match(start_marker, lines)
            end <- match(end_marker, lines)
            if (is.na(start) || is.na(end) || start >= end) {
              stop(sprintf("Template markers were not found: %s / %s", start_marker, end_marker), call. = FALSE)
            }
            c(lines[seq_len(start)], replacement, lines[end:length(lines)])
          }

          template <- readLines("cran-comments.md", warn = FALSE)
          rendered <- replace_block(
            template,
            "<!-- GHA_TESTS_START -->",
            "<!-- GHA_TESTS_END -->",
            test_results
          )

          dir.create("cran-submission", showWarnings = FALSE)
          writeLines(rendered, file.path("cran-submission", "cran-comments.md"))

          writeLines(
            c(
              paste(names(results), collapse = "\t"),
              apply(results, 1L, function(x) paste(x, collapse = "\t"))
            ),
            file.path("cran-submission", "cran-comments-results.tsv")
          )

      - name: Write next steps
        shell: bash
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '## CRAN Submission\n\n'
              printf 'Generated cran-comments.md, check results, and a CRAN source tarball.\n\n'
              printf 'See cran-submission/next-steps.md for the submission checklist.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build CRAN source tarball
        shell: bash
        run: |
          R CMD build . --no-manual --no-resave-data
          pkg_tarball=$(Rscript -e "x <- Sys.glob('*.tar.gz'); x <- x[file.exists(x)]; cat(x[which.max(file.info(x)\$mtime)])")
          ls -lh "$pkg_tarball"
          if tar -tzf "$pkg_tarball" | grep -E '(^|/)\.git(/|$)|\.(o|so|dll|dylib)$|vignettes/.*\.html$|(^|/)\.Rbuildignore$|(^|/)CITATION$'; then
            exit 1
          fi
          cp "$pkg_tarball" cran-submission/
          ls -lh cran-submission

      - name: Attach release assets and append CRAN comments
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" cran-submission/*.tar.gz --clobber
          gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > release-body-current.md
          Rscript -e '
            body <- readLines("release-body-current.md", warn = FALSE)
            cran <- readLines(file.path("cran-submission", "cran-comments.md"), warn = FALSE)
            next_steps <- readLines(file.path("cran-submission", "next-steps.md"), warn = FALSE)
            start <- "<!-- GHA_CRAN_SUBMISSION_START -->"
            end <- "<!-- GHA_CRAN_SUBMISSION_END -->"
            start_i <- match(start, body)
            end_i <- match(end, body)
            if (!is.na(start_i) && !is.na(end_i) && start_i <= end_i) {
              body <- body[-seq.int(start_i, end_i)]
            }
            while (length(body) > 0L && !nzchar(body[length(body)])) {
              body <- body[-length(body)]
            }
            block <- c(
              start,
              "## CRAN Comments",
              "",
              cran,
              "",
              next_steps,
              end
            )
            writeLines(c(body, "", block), "release-body.md")
          '
          gh release edit "$RELEASE_TAG" --notes-file release-body.md

      - name: Upload CRAN source tarball artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: cran-source-tarball
          path: cran-submission/*.tar.gz

      - name: Upload CRAN comments artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: cran-comments
          path: cran-submission/cran-comments.md

      - name: Upload CRAN check results artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: cran-check-results
          path: cran-submission/cran-comments-results.tsv

      - name: Upload next steps artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: cran-next-steps
          path: cran-submission/next-steps.md
